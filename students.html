<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحة الطلاب | KODY Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563EB; --blue-light:#60A5FA; --purple:#7C3AED; --purple-light:#C084FC;
    --green:#22C55E; --green-light:#4ADE80; --orange:#F59E0B; --red:#EF4444;
    --bg:#0B1220; --bg2:#0F172A; --surface:#131C31; --surface2:#0F1729;
    --line:rgba(148,163,184,.14); --text:#F8FAFC; --muted:#93A2BE;
    --radius:18px; --maxw:1180px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Cairo',sans-serif; line-height:1.6; }
  a{ color:inherit; text-decoration:none; }
  .container{ max-width:var(--maxw); margin:0 auto; padding:0 24px; }
  .bg-glow{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(900px 500px at 90% -10%, rgba(124,58,237,.25), transparent 60%),
      radial-gradient(700px 500px at 0% 10%, rgba(37,99,235,.22), transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  }
  header{ position:sticky; top:0; z-index:50; background:rgba(11,18,32,.75); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
  .nav{ display:flex; align-items:center; justify-content:space-between; padding:16px 24px; max-width:var(--maxw); margin:0 auto; }
  .logo img{ height:38px; width:auto; display:block; }
  .back-link{ font-size:14px; font-weight:700; color:var(--muted); }
  .back-link:hover{ color:var(--text); }

  .hero{ padding:60px 0 20px; text-align:center; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--purple-light);
    background:rgba(124,58,237,.14); border:1px solid rgba(124,58,237,.35); padding:7px 16px; border-radius:999px; margin-bottom:16px;
  }
  h1{ font-size:38px; font-weight:900; }
  .lead{ margin:14px auto 0; color:var(--muted); font-weight:600; max-width:560px; font-size:15.5px; }

  .search-box{
    max-width:520px; margin:34px auto 0; display:flex; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:8px;
  }
  .search-box input{
    flex:1; background:transparent; border:none; outline:none; color:var(--text);
    font-family:'Cairo',sans-serif; font-size:15px; padding:12px 14px;
  }
  .search-box input::placeholder{ color:var(--muted); }
  .search-box button{
    background:linear-gradient(135deg,var(--blue),var(--purple)); color:#fff; border:none;
    font-weight:800; font-size:14.5px; padding:12px 24px; border-radius:12px; cursor:pointer;
  }
  .search-msg{ margin-top:12px; font-size:13.5px; color:var(--red); font-weight:700; min-height:18px; }

  .grid-head{ text-align:center; max-width:600px; margin:70px auto 30px; }
  .grid-head h2{ font-size:26px; font-weight:900; }
  .grid-head p{ margin-top:10px; color:var(--muted); font-weight:600; font-size:14.5px; }

  .students-grid{
    max-width:var(--maxw); margin:0 auto; padding:0 24px 90px;
    display:grid; grid-template-columns:repeat(3,1fr); gap:18px;
  }
  .student-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:24px; display:flex; align-items:center; gap:16px; transition:transform .15s, border-color .15s;
  }
  .student-card:hover{ transform:translateY(-3px); border-color:rgba(96,165,250,.4); }
  .avatar{
    width:56px; height:56px; border-radius:14px; flex-shrink:0;
    background:linear-gradient(135deg,var(--orange),#FBBF24);
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:22px; color:#1a1200;
  }
  .student-card h3{ font-size:17px; margin-bottom:4px; }
  .student-card .lvl{ font-size:12.5px; color:var(--blue-light); font-weight:700; }
  .student-card .code{ font-size:11.5px; color:var(--muted); font-weight:700; margin-top:4px; }

  .empty-slot{
    border:1px dashed var(--line); border-radius:var(--radius); padding:24px;
    display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13.5px; font-weight:700;
    text-align:center;
  }

  @media (max-width:900px){ .students-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px){
    h1{ font-size:28px; }
    .students-grid{ grid-template-columns:1fr; padding:0 18px 60px; }
    .search-box{ flex-direction:column; }
    .search-box button{ width:100%; }
  }
</style>
</head>
<body>
<div class="bg-glow"></div>

<header>
  <div class="nav">
    <a class="logo" href="index.html"><img src="assets/logo.png" alt="KODY Academy"></a>
    <div style="display:flex; align-items:center; gap:20px;">
      <a class="back-link" href="lessons.html">الدروس</a>
      <a class="back-link" href="index.html">← الرئيسية</a>
    </div>
  </div>
</header>

<section class="hero container">
  <span class="eyebrow">📁 صفحات الطلاب</span>
  <h1>مساحة كل طالب في KODY</h1>
  <p class="lead">كل طالب عنده كود خاص وصفحة بروفايل بتعرض مستواه وأوسمته ومشروعه. اكتب الكود بتاعك أو دوّر على اسمك في القائمة تحت.</p>

  <div class="search-box">
    <input id="codeInput" type="text" placeholder="اكتب كود الطالب مثلاً 001">
    <button onclick="lookupCode()">افتح الصفحة</button>
  </div>
  <div class="search-msg" id="searchMsg"></div>
</section>

<div class="grid-head">
  <h2>الطلاب المتاح لهم صفحة دلوقتي</h2>
  <p>القائمة بتتحدث أول ما نضيف صفحات جديدة لطلاب تانيين</p>
</div>

<div class="students-grid" id="studentsGrid"></div>

<script>
  // سجل الطلاب: أضف أي طالب جديد هنا بنفس الشكل
  const students = [
    { code: "001", name: "معتز", level: "المستوى الأول — تأسيس البرمجة والذكاء الاصطناعي", page: "students/moataz.html" }
  ];

  const grid = document.getElementById('studentsGrid');
  students.forEach(s=>{
    const a = document.createElement('a');
    a.className = 'student-card';
    a.href = s.page;
    a.innerHTML = `
      <div class="avatar">${s.name.trim()[0]}</div>
      <div>
        <h3>${s.name}</h3>
        <div class="lvl">${s.level}</div>
        <div class="code">كود الطالب: ${s.code}</div>
      </div>
    `;
    grid.appendChild(a);
  });
  // خانات فاضية توضيحية لباقي الطلاب اللي هتتضاف
  for(let i=0;i<2;i++){
    const d = document.createElement('div');
    d.className = 'empty-slot';
    d.textContent = 'صفحة طالب جديدة قريبًا 🚀';
    grid.appendChild(d);
  }

  function lookupCode(){
    const val = document.getElementById('codeInput').value.trim().replace(/^0+/, '') || document.getElementById('codeInput').value.trim();
    const msg = document.getElementById('searchMsg');
    const found = students.find(s => s.code === document.getElementById('codeInput').value.trim() || s.code.replace(/^0+/,'') === val);
    if(found){
      window.location.href = found.page;
    } else {
      msg.textContent = 'مفيش طالب بالكود ده لسه، تأكد من الكود أو اسأل المدرب.';
    }
  }
  document.getElementById('codeInput').addEventListener('keydown', e=>{ if(e.key === 'Enter') lookupCode(); });
</script>

</body>
</html>
